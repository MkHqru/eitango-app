<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英単語学習アプリ（デモ版）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <span class="demo-badge">デモ版</span>
    <h1 class="app-title">英単語学習</h1>
  </header>

  <main class="container">
    <!-- ログイン画面 -->
    <section id="screen-login" class="card" hidden>
      <h2>ログイン</h2>
      <form id="login-form" autocomplete="off">
        <label for="login-id">ID</label>
        <input id="login-id" type="text" inputmode="latin" autocapitalize="off" spellcheck="false" required>
        <label for="login-password">パスワード</label>
        <input id="login-password" type="password" required>
        <p id="login-error" class="message error" hidden></p>
        <p id="login-info" class="message info" hidden></p>
        <button type="submit" class="btn primary">ログイン</button>
      </form>
      <div class="reset-area">
        <button id="reset-button" type="button" class="btn danger">デモデータをリセット</button>
      </div>
    </section>

    <!-- パスワード変更画面（初回ログイン時は必ずここを通る） -->
    <section id="screen-change-password" class="card" hidden>
      <h2>パスワード変更</h2>
      <p>はじめてのログインです。<strong id="change-user-id"></strong> さん、新しいパスワードを決めてください。</p>
      <form id="change-form" autocomplete="off">
        <label for="new-password">新しいパスワード（4文字以上）</label>
        <input id="new-password" type="password" required>
        <label for="confirm-password">新しいパスワード（確認）</label>
        <input id="confirm-password" type="password" required>
        <p id="change-error" class="message error" hidden></p>
        <button type="submit" class="btn primary">変更する</button>
      </form>
      <button type="button" class="btn secondary" data-action="logout">ログアウト</button>
    </section>

    <!-- 生徒のホーム画面 -->
    <section id="screen-student-home" class="card" hidden>
      <h2>生徒ホーム</h2>
      <p>ID：<strong id="student-user-id"></strong></p>
      <h3 class="section-title">単語テスト（1回10問）</h3>
      <button type="button" class="btn primary" data-direction="en-ja">英語 → 日本語（4択）</button>
      <button type="button" class="btn primary" data-direction="ja-en">日本語 → 英語（入力）</button>
      <button type="button" class="btn secondary" data-action="logout">ログアウト</button>
    </section>

    <!-- 単語テスト画面 -->
    <section id="screen-quiz" class="card" hidden>
      <div class="quiz-header">
        <span id="quiz-direction-label"></span>
        <span id="quiz-progress"></span>
      </div>
      <p id="quiz-pos" class="quiz-pos"></p>
      <p id="quiz-prompt" class="quiz-prompt"></p>

      <!-- 英→日：4択 -->
      <div id="quiz-choices" class="choices" hidden></div>

      <!-- 日→英：入力式（自動大文字化・自動修正をオフ） -->
      <form id="quiz-input-form" autocomplete="off" hidden>
        <label for="quiz-input">英語で入力</label>
        <input id="quiz-input" type="text" lang="en" inputmode="latin"
               autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn primary">答える</button>
      </form>

      <div id="quiz-feedback" class="feedback" hidden>
        <p id="quiz-feedback-result" class="feedback-result"></p>
        <p id="quiz-feedback-answer"></p>
        <button id="quiz-next" type="button" class="btn primary">次へ</button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="card" hidden>
      <h2>結果</h2>
      <p id="result-score" class="result-score"></p>
      <div id="result-wrong-area">
        <h3 class="section-title">間違えた単語</h3>
        <ul id="result-wrong-list" class="word-list"></ul>
      </div>
      <p id="result-perfect" class="message info" hidden>全問正解です！</p>
      <button id="result-home" type="button" class="btn primary">ホームに戻る</button>
    </section>

    <!-- 先生のホーム画面 -->
    <section id="screen-teacher-home" class="card" hidden>
      <h2>先生ホーム</h2>
      <p>ID：<strong id="teacher-user-id"></strong></p>
      <button type="button" class="btn secondary" data-action="logout">ログアウト</button>
    </section>
  </main>

  <script src="js/date.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/words.js"></script>
  <script src="js/records.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
